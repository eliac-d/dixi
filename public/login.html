<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPanel — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;--accent:#00ff9d;--text:#e2e8f0;--muted:#64748b;--danger:#ff4757}
  body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,157,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,157,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
  .scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px);pointer-events:none;z-index:999}
  .card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:48px;width:440px;animation:fadeUp .5s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:40px;justify-content:center}
  .logo-icon{width:40px;height:40px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .logo h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
  .logo span{color:var(--accent)}
  .terminal-header{
    background:#0a0a0f;
    border:1px solid var(--border);
    border-radius:2px;
    padding:8px 12px;
    margin-bottom:32px;
    font-size:11px;
    color:var(--muted);
    display:flex;align-items:center;gap:8px;
  }
  .terminal-header::before{content:'●';color:var(--danger)}
  h2{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:6px;text-align:center}
  p{color:var(--muted);font-size:11px;text-align:center;margin-bottom:32px}
  label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  input{width:100%;background:#0a0a0f;border:1px solid var(--border);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;padding:12px 16px;border-radius:2px;outline:none;margin-bottom:24px;transition:border-color .2s}
  input:focus{border-color:var(--accent)}
  button{width:100%;background:var(--accent);color:#000;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:14px;border:none;border-radius:2px;cursor:pointer;transition:all .2s}
  button:hover{background:#00e88a}
  button:disabled{opacity:.4;cursor:not-allowed}
  .error{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);color:var(--danger);padding:10px 14px;border-radius:2px;font-size:11px;margin-bottom:16px;display:none}
  .shake{animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .attempts{color:var(--danger);font-size:10px;text-align:center;margin-top:16px;letter-spacing:1px}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="card" id="card">
  <div class="logo">
    <div class="logo-icon">▲</div>
    <h1>V<span>Panel</span></h1>
  </div>
  <div class="terminal-header">vpanel@server:~$ authenticate</div>
  <h2>Acceso al sistema</h2>
  <p>Introduce tu clave maestra para continuar</p>
  <div id="error" class="error"></div>
  <label>Clave de acceso</label>
  <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button id="btn" onclick="login()">Autenticar →</button>
  <div class="attempts" id="attempts"></div>
</div>
<script>
  let tries=0;
  async function login(){
    const p=document.getElementById('password').value;
    const e=document.getElementById('error');
    const b=document.getElementById('btn');
    const card=document.getElementById('card');
    e.style.display='none';
    if(!p){e.textContent='Introduce tu clave';e.style.display='block';return;}
    b.disabled=true;b.textContent='Verificando...';
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
    const data=await r.json();
    if(data.ok){
      b.textContent='Acceso concedido ✓';
      setTimeout(()=>window.location='/',500);
    } else {
      tries++;
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      e.textContent='Clave incorrecta';
      e.style.display='block';
      if(tries>=3)document.getElementById('attempts').textContent=`${tries} intento(s) fallido(s)`;
      document.getElementById('password').value='';
      b.disabled=false;b.textContent='Autenticar →';
    }
  }
</script>
</body>
</html>
